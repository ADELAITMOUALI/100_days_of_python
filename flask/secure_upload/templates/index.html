<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure File Upload</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #faf8f3;
            color: #141e37;
            padding: 2rem;
            line-height: 1.6;
        }
        .container { max-width: 800px; margin: 0 auto; }
        .box {
            border: 4px solid #141e37;
            padding: 2rem;
            margin-bottom: 2rem;
            background: white;
        }
        h1 {
            font-size: 2.5rem;
            text-transform: uppercase;
            margin-bottom: 0.5rem;
            font-weight: 900;
        }
        h2 {
            font-size: 1.25rem;
            text-transform: uppercase;
            margin-bottom: 1rem;
            font-weight: 900;
        }
        .upload-zone {
            border: 4px solid #141e37;
            padding: 4rem 3rem;
            text-align: center;
            cursor: pointer;
            transition: background 0.2s;
            margin-bottom: 1rem;
            position: relative;
        }
        .upload-zone:hover, .upload-zone.dragging {
            background: #e6e4df;
        }
        .upload-zone input { display: none; }
        .upload-icon {
            font-size: 4rem;
            margin-bottom: 1rem;
        }
        .success {
            background: #22c55e;
            color: white;
            padding: 1.5rem;
            margin-bottom: 1rem;
            font-weight: bold;
            animation: slideIn 0.3s;
            border: 4px solid #141e37;
        }
        .error {
            background: #ef4444;
            color: white;
            padding: 1.5rem;
            margin-bottom: 1rem;
            font-weight: bold;
            border: 4px solid #141e37;
        }
        .loading {
            position: absolute;
            inset: 0;
            background: rgba(255, 255, 255, 0.9);
            display: none;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 1.1rem;
        }
        .loading.active { display: flex; }
        .info-box {
            border: 4px solid #141e37;
            background: #f5f5f5;
            padding: 1.5rem;
            margin-top: 2rem;
        }
        @keyframes slideIn {
            from { transform: translateY(-10px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="box">
            <h1>Secure File Upload</h1>
            <p>Upload your files securely to your private network. Drag & drop or click to browse.</p>
        </div>

        <div class="box">
            <h2>Upload Files</h2>
            <div class="upload-zone" id="dropZone">
                <input type="file" id="fileInput" multiple>
                <div class="upload-icon">📤</div>
                <p style="font-size: 1.1rem; margin-bottom: 0.5rem;"><strong>Click to upload</strong></p>
                <p style="color: #666;">or drag and drop files here</p>
                <p style="color: #666; font-size: 0.9rem; margin-top: 1rem;">Max file size: 50MB</p>
                <div class="loading" id="loading">Uploading...</div>
            </div>
            <div id="message"></div>
        </div>

        <div class="info-box">
            <p style="color: #666; font-size: 0.9rem;">
                Files are uploaded to your secure storage location. Check your upload directory to access them.
            </p>
        </div>
    </div>

    <script>
        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');
        const message = document.getElementById('message');
        const loading = document.getElementById('loading');

        dropZone.addEventListener('click', () => fileInput.click());
        
        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.classList.add('dragging');
        });
        
        dropZone.addEventListener('dragleave', () => {
            dropZone.classList.remove('dragging');
        });
        
        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('dragging');
            handleFiles(e.dataTransfer.files);
        });
        
        fileInput.addEventListener('change', (e) => {
            handleFiles(e.target.files);
        });

        async function handleFiles(fileList) {
            loading.classList.add('active');
            message.innerHTML = '';

            for (const file of fileList) {
                const formData = new FormData();
                formData.append('file', file);

                try {
                    const response = await fetch('/upload', {
                        method: 'POST',
                        body: formData
                    });

                    const result = await response.json();
                    
                    if (response.ok) {
                        message.innerHTML = '<div class="success">✓ Upload successful!<br><small>Your files have been securely uploaded.</small></div>';
                        setTimeout(() => message.innerHTML = '', 5000);
                    } else {
                        message.innerHTML = `<div class="error">✗ ${result.error}</div>`;
                    }
                } catch (error) {
                    message.innerHTML = '<div class="error">✗ Upload failed. Please try again.</div>';
                }
            }

            loading.classList.remove('active');
            fileInput.value = '';
        }
    </script>
</body>
</html>
